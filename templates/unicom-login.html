{% extends "base.html" %}

{% block content %}
<article class="unicom-login-page">
  <header class="unicom-login-heading">
    <h1>{{ page.title }}</h1>
  </header>

  <section id="unicom-login-app" class="unicom-login-app" data-api-base="/api/unicom" aria-labelledby="unicom-login-app-title">
    <div class="unicom-login-app-header">
      <div>
        <p class="unicom-login-kicker">应用</p>
        <h2 id="unicom-login-app-title">联通助手</h2>
      </div>
      <button id="unicom-login-help-button" class="unicom-login-help-button" type="button" aria-label="使用说明" aria-controls="unicom-login-help-dialog" aria-expanded="false" title="使用说明">?</button>
    </div>

    <div id="unicom-login-help-dialog" class="unicom-login-help-dialog" hidden>
      <section id="unicom-login-help-panel" class="unicom-login-help-panel" role="dialog" aria-modal="true" aria-labelledby="unicom-login-help-title">
        <div class="unicom-login-help-header">
          <strong id="unicom-login-help-title">使用说明</strong>
          <button id="unicom-login-help-close" class="unicom-login-help-close" type="button" aria-label="关闭使用说明" title="关闭">×</button>
        </div>
        <p>仅用于账号本人。手机号、短信验证码和生成的凭据只在当前页面中使用；本服务不会保存它们。</p>
        <p>离开页面或点击“清除”后，页面中的敏感数据会被丢弃。请妥善保管复制出的登录凭据。</p>
        <p class="unicom-login-help-projects">相关项目：<a class="external" href="https://github.com/canxin121/china_unicom_oxidebot" rel="noopener noreferrer" target="_blank">china_unicom_oxidebot</a>、<a class="external" href="https://github.com/canxin121/china-unicom-rs" rel="noopener noreferrer" target="_blank">china-unicom-rs</a></p>
      </section>
    </div>

    <div class="unicom-login-field">
      <label for="unicom-mobile">中国联通手机号</label>
      <input id="unicom-mobile" type="tel" inputmode="numeric" autocomplete="off" maxlength="11" placeholder="11 位手机号">
    </div>

    <div class="unicom-login-code-row">
      <div class="unicom-login-field">
        <label for="unicom-sms-code">短信验证码</label>
        <input id="unicom-sms-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="4–8 位验证码">
      </div>
      <button id="unicom-send-code" type="button">发送验证码</button>
    </div>

    <button id="unicom-login-submit" class="unicom-login-primary" type="button">登录并生成凭据</button>
    <p id="unicom-login-message" class="unicom-login-message" role="status" aria-live="polite"></p>

    <section id="unicom-login-result" class="unicom-login-result" hidden aria-labelledby="unicom-login-result-title">
      <div class="unicom-login-result-header">
        <div>
          <p class="unicom-login-kicker">敏感结果</p>
          <h2 id="unicom-login-result-title">登录凭据</h2>
        </div>
        <div class="unicom-login-result-actions">
          <button id="unicom-copy-package" class="unicom-login-icon-button" type="button" title="复制完整 JSON" aria-label="复制完整 JSON">复制 JSON</button>
          <button id="unicom-clear-result" class="unicom-login-icon-button unicom-login-danger" type="button" title="清除所有敏感数据" aria-label="清除所有敏感数据">清除</button>
        </div>
      </div>
      <p class="unicom-login-result-warning">将此 JSON 视作密码。请只复制到你自己的安全配置中，不要粘贴到聊天、Issue 或公共页面。</p>
      <div id="unicom-credential-rows" class="unicom-credential-rows"></div>
    </section>
  </section>
</article>
{% endblock content %}
